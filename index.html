<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JORGE MENDOZA</title>
    <!-- CSS de Lightbox -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.3/css/lightbox.min.css">
    <style>
        :root {
            --color-claro: #a6a6a6;
            --color-medio: #595959;
            --color-oscuro: #262626;
        }

        body { background-color: #0a0a0a; color: #fff; font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; padding-bottom: 60px; }
        
        .metallic {
            font-family: sans-serif; font-weight: 800; text-transform: uppercase;
            background: linear-gradient(to bottom, var(--color-claro), var(--color-medio), var(--color-oscuro));
            -webkit-background-clip: text; background-clip: text;
            color: transparent; text-shadow: 1px 1px 0px rgba(0,0,0,0.5);
        }

        /* Alineación a la izquierda como pediste */
        .header-left { padding: 30px 40px; text-align: left; }
        .name { font-size: 2rem; margin: 0; }
        .sub { color: #888; font-size: 0.7rem; letter-spacing: 2px; margin-top: 5px; }
        
        /* Contenedor centralizado para video y galería */
        .content { max-width: 600px; margin: 0 auto; padding: 0 20px; }
        
        /* Video Vimeo */
        .vimeo-wrapper { 
            position: relative; width: 100%; aspect-ratio: 16 / 9; 
            margin: 20px auto; border: 1px solid #333; overflow: hidden; background: #000; 
        }
        .vimeo-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        /* Galería corregida: miniaturas uniformes */
        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-top: 20px; }
        .gallery a { display: block; border: 1px solid #333; overflow: hidden; }
        .gallery img { width: 100%; height: 120px; object-fit: cover; display: block; }
        
        footer { padding: 20px; text-align: center; }
        .footer-brand { color: #444; font-size: 0.7rem; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="header-left">
        <h1 class="name metallic">JORGE MENDOZA</h1>
        <p class="sub">BILINGUAL ACTOR | COLOMBIA/CANADA | SAG-AFTRA MEMBER</p>
    </div>

    <div class="content">
        <!-- Video Vimeo -->
        <div class="vimeo-wrapper">
            <iframe src="https://player.vimeo.com/video/1194899790?title=0&amp;byline=0&amp;portrait=0&amp;badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479" frameborder="0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen title="Jorge Mendoza_Reel"></iframe>
        </div>

        <!-- Galería -->
        <div class="gallery">
            <a href="Photos/Album1/FOTO_1_1.webp" data-lightbox="galeria"><img src="Photos/Album1/FOTO_1_1.webp" alt="Foto"></a>
            <a href="Photos/Album1/FOTO_1_2.webp" data-lightbox="galeria"><img src="Photos/Album1/FOTO_1_2.webp" alt="Foto"></a>
            <a href="Photos/Album1/FOTO_1_3.webp" data-lightbox="galeria"><img src="Photos/Album1/FOTO_1_3.webp" alt="Foto"></a>
            <a href="Photos/Album1/FOTO_1_4.webp" data-lightbox="galeria"><img src="Photos/Album1/FOTO_1_4.webp" alt="Foto"></a>
        </div>
    </div>

    <!-- Script de Lightbox al final -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.3/js/lightbox-plus-jquery.min.js"></script>

    <footer>
        <div class="footer-brand">JORGE MENDOZA | PROFESSIONAL ACTOR</div>
    </footer>

</body>
</html>
